<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Music Tracker</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #121212;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            text-align: center;
            padding: 40px;
        }
        a.btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #1DB954;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎵 Music Tracker</h1>
        <p>Suis le ratio musique chrétienne vs mondaine de ton écoute Spotify</p>
        <a class="btn" href="/login">Se connecter avec Spotify</a>
    </div>
</body>
</html>
